<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單管理系統 - Vue.js 版</title>
    <!-- 引入 Tailwind CSS (用於快速美化介面) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 (前端框架) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Axios (用於發送 HTTP 請求給後端) -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-900">

    <!-- Vue 應用的掛載點 -->
    <div id="app" v-cloak class="max-w-4xl mx-auto py-10 px-4">

        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-2">訂單管理系統</h1>
            <p class="text-slate-500">使用 Vue.js 3 + Tailwind CSS + Spring Boot 實作</p>
        </header>

        <!-- 第一部分：新增訂單表單 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-10">
            <h2 class="text-xl font-bold mb-6 flex items-center">
                <span class="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center mr-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                            clip-rule="evenodd" />
                    </svg>
                </span>
                新增訂單
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- v-model 是 Vue 的雙向綁定，讓輸入框內容與 JavaScript 變數同步 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">客戶名稱</label>
                    <input v-model="newOrder.customerName" type="text"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                        placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">商品名稱</label>
                    <input v-model="newOrder.productName" type="text"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                        placeholder="請輸入商品內容">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">數量</label>
                    <input v-model.number="newOrder.quantity" type="number"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">價格</label>
                    <input v-model.number="newOrder.price" type="number"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>
            <!-- @click 是 Vue 的按鈕點擊事件 -->
            <button @click="createOrder"
                class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-200">
                確認新增訂單
            </button>
        </section>

        <!-- 第二部分：訂單列表 -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">訂單清單</h2>
                <button @click="fetchOrders"
                    class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    重新整理
                </button>
            </div>

            <div v-if="orders.length === 0"
                class="text-center py-20 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                <p class="text-slate-400">目前尚無訂單資料。</p>
            </div>

            <div v-else class="grid gap-4">
                <!-- v-for 用來迴圈產生訂單卡片 -->
                <div v-for="order in orders" :key="order.id"
                    class="group bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:border-indigo-300 transition">
                    <div class="flex items-center space-x-4">
                        <div
                            class="w-12 h-12 bg-slate-100 group-hover:bg-indigo-50 rounded-full flex items-center justify-center text-slate-500 group-hover:text-indigo-600 font-bold transition">
                            {{ order.id }}
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800">{{ order.productName }}</h3>
                            <p class="text-sm text-slate-500">客戶：{{ order.customerName }} | 數量：{{ order.quantity }} |
                                單價：${{ order.price }}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-6">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">
                            {{ order.status || '處理中' }}
                        </span>
                        <button @click="deleteOrder(order.id)" class="text-slate-300 hover:text-red-500 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- 啟動 Vue 應用的 JavaScript -->
    <script src="app.js"></script>
</body>

</html>
