spring.application.name=SpringBootDemo

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest

# --- Kafka 高併發優化配置 ---
# 批量發送大小 (Batching): 增加伺服器吞吐量
spring.kafka.producer.batch-size=16384
# 延遲準備時間: 稍微等待以收集更多訊息組成批次，平衡延遲與吞吐
spring.kafka.producer.properties.linger.ms=5
# 壓縮類型: 減少網路 I/O 負擔 (可用 gzip, snappy, lz4)
spring.kafka.producer.compression-type=snappy
# 確認機制: 1 代表 Leader 收到即回覆（平衡性能與可靠性）
spring.kafka.producer.acks=1
# 重試次數
spring.kafka.producer.retries=3
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Day 10: 自定義配置示範 ---
library.name=高階 Java 圖書館系統
library.version=2.0.0-SNAPSHOT
library.welcome-message=歡迎來到學員專屬圖書館！

# Disable Seata to allow local startup without Seata Server
seata.enabled=false

# Disable gRPC server to avoid discovery errors in this environment
grpc.server.enabled=false
server.port=8080

# IntelliJ／bootRun：啟動橫幅 + 探測（見 StartupInfoLogger）
startup.info.enabled=true
startup.info.project-name=SpringBootDemo
startup.info.frontend=none
startup.info.auth=false
startup.info.h2=true
startup.info.api-docs=true
startup.info.probe=true
startup.info.extra-paths=/api/orders,/library
